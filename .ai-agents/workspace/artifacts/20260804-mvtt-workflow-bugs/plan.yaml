    skill_hint: mvt-implement
    artifacts:
      files:
        - sources/skills/mvt-cleanup/business.md
        - sources/skills/mvt-status/business.md
        - sources/skills/mvt-resume/business.md
        - sources/skills/mvt-sync-context/business.md
        - sources/skills/mvt-check-context/business.md
    notes: >
      Replace executor-controlled recursive artifact discovery with artifact-scan output. Integrate confirmed checker repairs into cleanup's one final session command. Extend resume to activate an
      eligible deferred epic child through epic-update and then register that child through one session-update call, with explicit divergence reporting.
    acceptance:
      - Status, resume, sync-context, and check-context have no fallback recursive live artifact scan
      - Cleanup only removes session ids for artifact directories that were moved successfully
      - Cleanup applies selected repairs, removals, and truncation in one session-update invocation
      - Resume can reactivate an eligible child when active_epic.current_change is empty
      - Archived artifacts cannot enter live status, resume, sync, or token-accounting inputs
    deliverables:
      freshness: current
