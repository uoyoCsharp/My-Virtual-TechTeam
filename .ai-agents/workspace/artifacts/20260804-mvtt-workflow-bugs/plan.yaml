tasks:
  - id: t1-session-lifecycle-core
    title: Harden session lifecycle mutations
    status: done
    completed_at: 2026-08-04T03:41:20.821Z
    depends_on: []
    project:
      - mvtt
    skill_hint: mvt-implement
    artifacts:
      files:
        - sources/scripts/session-update.js
        - sources/scripts/session-update.md
        - test/session-update.test.ts
    notes: >
      Implement ADR-2, ADR-7, ADR-8, and ADR-10 in the sole session writer. Reject implicit active-change replacement and empty lifecycle targets before mutation. Add validated change repairs, abandon
      operations, composed change/epic terminal updates, deterministic operation ordering, collision checks, and atomic no-write failures.
    acceptance:
      - --new-change rejects a different non-empty active_change.id without changing session.yaml
      - Close and abandon operations reject empty active change or epic ids without appending history
      - Repair statuses accept only active, done, or abandoned and reject collisions atomically
      - A single command can close or abandon the active change and terminal epic consistently
      - Session-update focused tests pass and npm run build completes successfully
    deliverables:
      freshness: current
  - id: t2-epic-lifecycle-core
    title: Implement deterministic epic transitions
    status: done
    completed_at: 2026-08-04T03:44:45.885Z
    depends_on: []
    project:
      - mvtt
    skill_hint: mvt-implement
    artifacts:
      files:
        - sources/scripts/epic-update.js
        - sources/scripts/epic-update.md
        - test/epic-update.test.ts
    notes: >
      Make epic-update an epic.yaml-only writer per ADR-10. Add --complete-child --defer-next and --abandon-child using the existing dependency resolver. Define terminal status as abandoned when all
      children are abandoned and done when terminal children include at least one completed child. Preserve deterministic child selection.
    acceptance:
      - --defer-next marks the child done, leaves pending children pending, and clears current_change
      - --abandon-child advances to the first eligible child using deterministic array order
      - All-abandoned epics become abandoned; mixed done/abandoned terminal epics become done
      - epic-update never reads or writes session.yaml and emits no session_sync field
      - Epic-update focused tests pass and npm run build completes successfully
    deliverables:
      freshness: current
  - id: t3-artifact-state-tools
    title: Build deterministic artifact and state tools
    status: done
    completed_at: 2026-08-04T03:47:50.653Z
    depends_on: []
    project:
      - mvtt
    skill_hint: mvt-implement
    artifacts:
      files:
        - sources/scripts/lib/workspace-artifacts.js
        - sources/scripts/artifact-scan.js
        - sources/scripts/artifact-scan.md
        - sources/scripts/workspace-state-check.js
        - sources/scripts/workspace-state-check.md
        - build-scripts.js
        - test/artifact-scan.test.ts
        - test/workspace-state-check.test.ts
    notes: >
      Implement ADR-5 and ADR-6 as standalone bundled scripts with no external runtime dependency. Exclude _archived before enumeration, return stable workspace-relative JSON, and keep the workspace
      checker strictly read-only. Exclude the current active change from stale done-plan findings and emit manual_review for plan or epic reference corruption.
    acceptance:
      - All scanner modes return sorted entries with no _archived path segment
      - Plans mode includes only immediate live child plan.yaml files
      - PLAN_DONE_INDEX_ACTIVE is absent for session.active_change.id and present for stale indexed changes
      - Missing/invalid plans and unresolved epics recommend manual_review without writing files
      - Both new scripts bundle to standalone .cjs files and their focused tests pass
    deliverables:
      freshness: current
  - id: t4-lifecycle-workflows
    title: Integrate lifecycle workflow routing
    status: done
    completed_at: 2026-08-04T03:51:22.019Z
    depends_on:
      - t1-session-lifecycle-core
      - t2-epic-lifecycle-core
    project:
      - mvtt
    skill_hint: mvt-implement
    artifacts:
      files:
        - sources/sections/session-update.md
        - sources/skills/mvt-update-plan/manifest.yaml
        - sources/skills/mvt-update-plan/business.md
        - sources/skills/mvt-analyze/manifest.yaml
        - sources/skills/mvt-analyze/business.md
        - sources/skills/mvt-plan-dev/manifest.yaml
    notes: >
      Implement ADR-1, ADR-3, ADR-4, and ADR-9 in the assembled workflows. Route plan-backed, already-done, plan-less, recovery, defer, finalization, and abandonment cases. Add the pre-artifact
      active-change conflict gate to analyze, preserve same-id planning, and restrict runtime-selected State Update rendering to mvt-update-plan.
    acceptance:
      - mvt-analyze resolves a different active change before generating an id or writing analysis.md
      - mvt-update-plan supports plan-less completion, defer-next, finalize, abandon, and recovery choices
      - Every successful route invokes session-update exactly once with the route-appropriate flags
      - Repair plan routes to mvt-plan-dev and missing/invalid plan recovery requires explicit confirmation
      - Assembled skill validation and npm run build complete successfully
    deliverables:
      freshness: current
  - id: t5-discovery-cleanup-resume
    title: Migrate discovery cleanup and resume workflows
    status: done
    completed_at: 2026-08-04T03:53:33.050Z
    depends_on:
      - t1-session-lifecycle-core
      - t2-epic-lifecycle-core
      - t3-artifact-state-tools
      - t4-lifecycle-workflows
    project:
