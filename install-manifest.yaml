version: 2

generated:
  - pattern: ".claude/skills/mvt-*/SKILL.md"
    source: "build:skills"
  - pattern: ".agents/skills/mvt-*/SKILL.md"
    source: "build:skills"
  - pattern: ".qoder/skills/mvt-*/SKILL.md"
    source: "build:skills"
  - pattern: ".cursor/skills/mvt-*/SKILL.md"
    source: "build:skills"
  - pattern: ".opencode/skills/mvt-*/SKILL.md"
    source: "build:skills"
  - pattern: ".mvtt/skills/_templates/*-output.md"
    source: "build:templates"
  - pattern: ".mvtt/skills/_templates/project-context.md"
    source: "build:templates"
  - pattern: ".mvtt/knowledge/core/_framework/**"
    source: "copy:sources/knowledge/core/_framework/"
  - pattern: ".mvtt/scripts/session-update.cjs"
    source: "bundle:sources/scripts/session-update.js"
  - pattern: ".mvtt/scripts/plan-update.cjs"
    source: "bundle:sources/scripts/plan-update.js"
  - pattern: ".mvtt/scripts/epic-update.cjs"
    source: "bundle:sources/scripts/epic-update.js"
  - pattern: ".mvtt/scripts/requirement-source.cjs"
    source: "bundle:sources/scripts/requirement-source.js"
  - pattern: ".mvtt/scripts/skill-scaffold.cjs"
    source: "bundle:sources/scripts/skill-scaffold.js"
  - pattern: ".mvtt/scripts/plan-update.md"
    source: "copy:sources/scripts/plan-update.md"
  - pattern: ".mvtt/scripts/epic-update.md"
    source: "copy:sources/scripts/epic-update.md"
  - pattern: ".mvtt/scripts/requirement-source.md"
    source: "copy:sources/scripts/requirement-source.md"
  - pattern: ".mvtt/scripts/skill-scaffold.md"
    source: "copy:sources/scripts/skill-scaffold.md"

create_once:
  - path: ".mvtt/config.yaml"
    source: "sources/defaults/config.yaml"
  - path: ".mvtt/workspace/session.yaml"
    source: "sources/defaults/session.yaml"
  - path: ".mvtt/workspace/project-context.yaml"
    source: "sources/defaults/project-context.yaml"
  - path: ".mvtt/knowledge/core/manifest.yaml"
    source: "sources/knowledge/core/manifest.yaml"
  # Reconcile-merged on update (see src/fs/registry-merge.ts): framework skills
  # are refreshed, user `custom: true` skills and added knowledge bindings kept.
  - path: ".mvtt/registry.yaml"
    source: "registry.yaml"

user_data_dirs:
  - ".mvtt/workspace/artifacts/"
  - ".mvtt/skills/_templates/custom/"
  - ".mvtt/knowledge/principle/"
  - ".mvtt/knowledge/project/"
  - ".mvtt/knowledge/project/_generated/"
  - ".mvtt/knowledge/core/user/"
