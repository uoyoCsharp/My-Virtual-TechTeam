name: mvt-quick-dev
output: .claude/skills/mvt-quick-dev/SKILL.md

frontmatter:
  name: mvt-quick-dev
  description: "Quickly implement well-scoped, clearly specified changes without the full analyze-design-implement workflow — including multi-file mechanical sweeps; architecturally neutral by default, structural changes only with explicit user waiver."

sections:
  - type: inline
    content: |
      # MVT Quick Dev

      ## Purpose

      Implement well-scoped, clearly specified changes quickly, bypassing the full workflow — including multi-file mechanical sweeps. Architecturally neutral by default; structural changes only with explicit user waiver. Produces no artifacts — results are conversation-only.

  - type: shared
    source: sections/role-header.md
    params:
      role: Developer
      role_desc: "an Implementation Specialist"
      decision_rules:
        - rule: "Change is Trivial (1 file, ≤10 lines) -> Implement directly, conversation-only"
        - rule: "Change is Simple (1-3 files, no new module, no interface break) -> Implement, show plan first, conversation-only"
        - rule: "Change is Mechanical Sweep (one declared 1:1 transform, no logic change) -> Declare pattern, implement, prove zero residue"
        - rule: "Change is Wide (>3 files, architecturally neutral) -> Show expanded plan, confirm before proceeding"
        - rule: "Change is Structural -> Warn per schema, require an explicit waiver choice before proceeding"
        - rule: "Ambiguous scope -> Ask user to confirm before proceeding"
        - rule: "Implementation reveals unplanned structural scope -> Pause, reclassify, re-confirm before touching it"
        - rule: "Existing tests cover changed code -> Suggest running them"
      boundaries:
        - scope: "analyze complex requirements"
          skill: "/mvt-analyze"
        - scope: "design architecture"
          skill: "/mvt-design"
        - scope: "review code"
          skill: "/mvt-review"
      boundaries_note: >-
        **Waiver override**: these Boundaries are default routing, not refusals. Structural signals are gated by the Step 5 warning
        menu (WS-1), not by this list: a granted `Proceed (waive: <risk>)` authorizes the named risk, recorded as `waived: <risk>` in
        the Step 9 summary. Unwaived scope still routes to the owning skill.

  - type: shared
    source: sections/turn-boundary-contract.md
    params:
      role: Developer
      this_skill: mvt-quick-dev

  - type: shared
    source: sections/activation-protocol.md
    params:
      activation_reads:
        - session.yaml
      extended_context:
        - ".ai-agents/knowledge/project/_generated/project-context.md -- Module/layer map (optional)"
        - "Target source files (load based on change description)"

  - type: shared
    source: sections/language-constraint.md

  - type: shared
    source: sections/output-format-constraint.md

  - type: shared
    source: sections/confirmation-prompt.md

  - type: inline
    content: |
      ## Operation Mode: Shortcut

      This skill operates as a shortcut — it can execute at any time without checking workflow prerequisites.
      - Do NOT update `active_change` fields (this is a shortcut operation, not a workflow phase).
      - Do NOT create an `active_change` if one doesn't already exist.
      - Do NOT write any artifact or document — results are conversation-only.
      - Do NOT interact with plan.yaml in any way — this skill is plan-independent.

  - type: file
    source: ./business.md

  - type: shared
    source: sections/session-update.md
    params:
      current_skill: mvt-quick-dev
      no_change: true

  - type: shared
    source: sections/footer-next-steps.md
    params:
      current_skill: mvt-quick-dev
      conditional_suggestions:
        conditions:
          - condition: "change applied, tests exist for affected code"
            primary: mvt-test
            primary_desc: "Run tests on the changed code"
          - condition: "change applied, no tests exist"
            primary: mvt-review
            primary_desc: "Quick review of the change"
          - condition: "change was more complex than expected"
            primary: mvt-analyze
            primary_desc: "Do a full analysis for this change"
