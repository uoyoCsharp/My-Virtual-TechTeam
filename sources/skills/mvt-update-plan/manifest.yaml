name: mvt-update-plan
output: .claude/skills/mvt-update-plan/SKILL.md

frontmatter:
  name: mvt-update-plan
  description: "Update tasks or complete the lifecycle of the active change. Use this skill to change plan task status, finalize or abandon plan-backed and plan-less changes, recover missing plans, and advance or defer epic children."

sections:
  - type: inline
    content: |
      # MVT Update Plan

      ## Purpose

      Apply incremental updates to the active plan or perform an explicit active-change lifecycle transition. Task updates can mark work done/blocked/skipped and auto-advance `current_tasks`; lifecycle routes can keep open, finalize, abandon, recover, or transition an epic child.

  - type: shared
    source: sections/role-header.md
    params:
      role: Architect
      role_desc: "a Development Planner"
      decision_rules:
        - rule: "Task id provided AND target status valid -> Apply update, advance current_tasks, write back"
        - rule: "Task id missing AND only one task is in_progress -> Default to that task"
        - rule: "Target status would create an invalid current_tasks -> Recompute current_tasks automatically"
        - rule: "All tasks become done -> Set plan.status = done, current_tasks = {}"
        - rule: "active_change.plan_path is empty -> Enter intentional plan-less lifecycle routing"
        - rule: "active_change.plan_path is non-empty but missing or invalid -> Enter explicit recovery routing"

      boundaries:
        - scope: "create new tasks or restructure the plan"
          skill: "/mvt-plan-dev"
        - scope: "create or modify the active change itself"
          skill: "/mvt-analyze"
        - scope: "implement code"
          skill: "/mvt-implement"

  - type: shared
    source: sections/turn-boundary-contract.md
    params:
      role: Architect
      this_skill: mvt-update-plan

  - type: shared
    source: sections/activation-protocol.md
    params:
      activation_reads:
        - session.yaml
      extended_context:
        - "{active_change.plan_path} -- The plan to update (resolved from session.yaml)"
      has_preflight: true
      checks:
        - order: "1"
          field: "session.initialized_at"
          level: "WARN"
          message: "Session not initialized. Run `/mvt-init` first."
        - order: "2"
          field: "active_change.id"
          level: "BLOCK"
          message: "No active change. Run `/mvt-analyze` first."

  - type: shared
    source: sections/language-constraint.md

  - type: shared
    source: sections/output-format-constraint.md

  - type: shared
    source: sections/confirmation-prompt.md

  - type: inline
    content: |
      ## Operation Mode: Shortcut

      This skill operates as a shortcut — it can execute whenever an active change exists.
      - Performs surgical edits only — never overwrites the whole plan structure.
      - Re-validates the resulting plan before writing; aborts on validation failure.

  - type: file
    source: ./business.md

  - type: inline
    content: |
      ## Output Format

      Render exactly one inline summary shape (no external template).

      When Step 4 updated a task, use:

      ```markdown
      ## Plan Update

      ### Change Applied
      - **Task**: {task_id} -- {task_title}
      - **Status**: {old_status} -> {new_status}
      - **Artifacts attached**: {comma_separated_list_or_"(none)"}
      - **Notes**: {notes_or_"(unchanged)"}

      ### Plan Progress
      | # | id | title | status |
      |---|----|----|--------|
      | ... |

      Progress: {done_count}/{total_count}
      Current tasks: {new_current_tasks_map_or_"(plan complete)"}

      ### Next
      {one-line guidance based on the selected lifecycle route}
      ```

      When Steps 2-4 were skipped, use:

      ```markdown
      ## Lifecycle Update

      - **Change**: {active_change.id} -- {active_change.title}
      - **Plan state**: {plan-less | already done | recovery | in progress}
      - **Action**: {kept open | finalized | abandoned | repair requested | cancelled}
      - **Epic transition**: {result_or_"(none)"}
      - **Session update**: {applied_flags_and_result_or_"(not run)"}

      ### Next
      {one-line guidance based on the selected lifecycle route}
      ```

      Every response MUST end with a Suggested Next Steps section.

  - type: shared
    source: sections/session-update.md
    params:
      current_skill: mvt-update-plan
      runtime_lifecycle: true

  - type: shared
    source: sections/script-usage-rule.md
    params:
      uses_plan_update: true
      epic_update_inline_modes_only: true

  - type: shared
    source: sections/footer-next-steps.md
    params:
      current_skill: mvt-update-plan
      conditional_suggestions:
        conditions:
          - condition: "plan_done AND change kept open"
            primary: mvt-review
            primary_desc: "Review the completed plan while the change remains active"
          - condition: "change finalized"
            primary: mvt-sync-context
            primary_desc: "Aggregate the finalized change before cleanup"
          - condition: "default"
            primary: mvt-implement
            primary_desc: "Continue with the next task from current_tasks"
        alternatives:
          - skill: mvt-test
            desc: "Validate completed work before finalizing the change"
          - skill: mvt-resume
            desc: "Refresh context after task transitions"
          - skill: mvt-status
            desc: "Inspect overall progress across changes"
